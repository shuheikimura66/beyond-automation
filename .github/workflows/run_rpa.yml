name: SquadBeyond RPA

on:
  repository_dispatch:
    types: [run-rpa]

jobs:
  run-playwright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm init -y
          npm install playwright axios
          npx playwright install --with-deps chromium

      - name: Run RPA Script
        env:
          SQUADBEYOND_ID: ${{ secrets.SQUADBEYOND_ID }}
          SQUADBEYOND_PASS: ${{ secrets.SQUADBEYOND_PASS }}
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          ROW_IDX: ${{ github.event.client_payload.row_idx }}
          DOMAIN: ${{ github.event.client_payload.domain }}
          GROUP_NAME: ${{ github.event.client_payload.group_name }}
          ACCOUNT_NAME: ${{ github.event.client_payload.account_name }}
          TARGET_ARTICLE: ${{ github.event.client_payload.target_article }}
          SEARCH_KEYWORD: ${{ github.event.client_payload.search_keyword }}
          DELIVERY_URL: ${{ github.event.client_payload.delivery_url }} 
        run: node task.js

      - name: Upload Error Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error-screenshot.png
          retention-days: 3

      - name: Upload Success Screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-check
          path: final-check.png
          retention-days: 3
