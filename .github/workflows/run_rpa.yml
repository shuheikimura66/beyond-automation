name: SquadBeyond RPA

# GASから「run-rpa」という名前の信号（Webhook）が来た時に起動する設定
on:
  repository_dispatch:
    types: [run-rpa]

jobs:
  run-playwright:
    runs-on: ubuntu-latest # クラウド上のLinux環境を借りる
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run RPA Script
        # GASから送られてきたデータ（client_payload）を環境変数としてセットする
        env:
          SQUADBEYOND_ID: ${{ secrets.SQUADBEYOND_ID }}
          SQUADBEYOND_PASS: ${{ secrets.SQUADBEYOND_PASS }}
          ROW_IDX: ${{ github.event.client_payload.row_idx }}
          DOMAIN: ${{ github.event.client_payload.domain }}
          GROUP_NAME: ${{ github.event.client_payload.group_name }}
          TARGET_URL: ${{ github.event.client_payload.target_url }}
          ACCOUNT_NAME: ${{ github.event.client_payload.account_name }}
          ARTICLE_NAME: ${{ github.event.client_payload.article_name }}
        run: node task.js
- name: Upload Video
        if: always() # 成功しても失敗しても必ず実行
        uses: actions/upload-artifact@v4
        with:
          name: execution-video
          path: videos/
          retention-days: 3 # 3日間保存
